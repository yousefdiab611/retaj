name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.18.0"

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install root + workspace deps
        run: npm install --no-audit --no-fund

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint --workspaces --if-present

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - name: Generate Prisma client (sqlite dev schema, no DB needed)
        working-directory: backend
        run: npx prisma generate --schema prisma/schema.prisma
      - run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: install
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retaj_user
          POSTGRES_PASSWORD: retaj_pass
          POSTGRES_DB: retaj_store_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U retaj_user -d retaj_store_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://retaj_user:retaj_pass@localhost:5432/retaj_store_test?schema=public
      JWT_SECRET: ci-test-jwt-secret-must-be-32-chars-long-yes
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate --schema prisma/schema.prisma
      - run: npm run test --workspaces --if-present

  build:
    name: Build packages
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate --schema prisma/schema.prisma
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            backend/dist
            frontend/dist
          retention-days: 7

  docker-build:
    name: Build Docker images (smoke)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          load: true
          tags: retaj/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          load: true
          tags: retaj/web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
