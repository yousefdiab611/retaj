name: Desktop Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      include_mac:
        description: "Also build the macOS installer"
        required: false
        default: false
        type: boolean
      include_linux:
        description: "Also build the Linux AppImage / .deb"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  NODE_VERSION: "20.18.0"

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root + workspace deps
        run: npm install --no-audit --no-fund

      - name: Generate Postgres Prisma client (for backend type-check / build)
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Stage standalone backend bundle (Windows binary engine)
        working-directory: frontend
        run: node scripts/stage-desktop-backend.cjs

      - name: Build Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run build:desktop:win

      - name: List produced artefacts
        if: always()
        shell: bash
        run: |
          echo "--- dist-electron ---"
          if [ -d dist-electron ]; then find dist-electron -maxdepth 4 -type f | sort; fi

      - name: Upload Windows artefacts
        uses: actions/upload-artifact@v4
        with:
          name: retaj-desktop-windows
          path: |
            dist-electron/**/*.exe
            dist-electron/**/*.msi
            dist-electron/**/latest*.yml
          if-no-files-found: warn
          retention-days: 30

  build-macos:
    name: Build macOS installer
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.include_mac)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --no-audit --no-fund
      - working-directory: backend
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
        run: npx prisma generate --schema prisma/schema.prisma
      - working-directory: frontend
        run: node scripts/stage-desktop-backend.cjs
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:desktop:mac
      - uses: actions/upload-artifact@v4
        with:
          name: retaj-desktop-macos
          path: |
            dist-electron/**/*.dmg
            dist-electron/**/*.zip
            dist-electron/**/latest*.yml
          if-no-files-found: warn
          retention-days: 30

  build-linux:
    name: Build Linux installer
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.include_linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --no-audit --no-fund
      - working-directory: backend
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
        run: npx prisma generate --schema prisma/schema.prisma
      - working-directory: frontend
        run: node scripts/stage-desktop-backend.cjs
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:desktop:linux
      - uses: actions/upload-artifact@v4
        with:
          name: retaj-desktop-linux
          path: |
            dist-electron/**/*.AppImage
            dist-electron/**/*.deb
            dist-electron/**/latest*.yml
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artefacts
        run: find artifacts -type f -maxdepth 4 | sort
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
