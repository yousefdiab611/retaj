name: Desktop Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag for this manual build (e.g. v1.2.0)"
        required: false
      windows_only:
        description: "Build only the Windows installer"
        required: false
        default: "true"
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: "20.18.0"

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            script: build:desktop:win
            always: true
          - os: macos-latest
            artifact: macos
            script: build:desktop:mac
            always: false
          - os: ubuntu-latest
            artifact: linux
            script: build:desktop:linux
            always: false
    runs-on: ${{ matrix.os }}
    # Always build Windows; build mac/linux only when explicitly requested
    # (windows_only != "true") or when releasing via tag push.
    if: |
      matrix.always == true ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.windows_only != 'true'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root + workspace deps
        run: npm install --no-audit --no-fund

      - name: Generate Postgres Prisma client (for backend type-check / build)
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Stage standalone backend bundle (Windows binary engine)
        working-directory: frontend
        run: node scripts/stage-desktop-backend.cjs

      - name: Build desktop bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing (optional)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing (optional)
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run ${{ matrix.script }}

      - name: List produced artefacts
        if: always()
        shell: bash
        run: |
          echo "--- dist-electron ---"
          if [ -d dist-electron ]; then find dist-electron -maxdepth 4 -type f | sort; fi

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: retaj-desktop-${{ matrix.artifact }}
          path: |
            dist-electron/**/*.exe
            dist-electron/**/*.msi
            dist-electron/**/*.dmg
            dist-electron/**/*.zip
            dist-electron/**/*.AppImage
            dist-electron/**/*.deb
            dist-electron/**/latest*.yml
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artefacts
        run: find artifacts -type f -maxdepth 4 | sort
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
