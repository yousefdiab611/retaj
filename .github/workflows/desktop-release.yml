name: Desktop Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag for this manual build (e.g. v1.2.0)"
        required: false

permissions:
  contents: write

env:
  NODE_VERSION: "20.18.0"

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
            script: build:desktop:linux
          - os: macos-latest
            artifact: macos
            script: build:desktop:mac
          - os: windows-latest
            artifact: windows
            script: build:desktop:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root + workspace deps
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Build backend (TypeScript)
        run: npm run build --workspace backend

      - name: Build desktop bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run ${{ matrix.script }}

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: retaj-desktop-${{ matrix.artifact }}
          path: |
            dist-electron/**/*.exe
            dist-electron/**/*.dmg
            dist-electron/**/*.zip
            dist-electron/**/*.AppImage
            dist-electron/**/*.deb
            dist-electron/**/latest*.yml
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: List artefacts
        run: find artifacts -type f -maxdepth 4 | sort
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
