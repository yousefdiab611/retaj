name: Bug report
description: Something is broken or behaving unexpectedly.
title: "[bug] "
labels: [bug, triage]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Be specific. Include the surface (POS, admin, mobile, desktop, API).
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Expected behaviour
  - type: input
    id: version
    attributes:
      label: App / API version
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      render: shell
