name: Feature request
description: Propose a new capability or enhancement.
title: "[feat] "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are we solving?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: acceptance
    attributes:
      label: Acceptance criteria (one-liner)
