version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: retaj-postgres
    environment:
      POSTGRES_DB: retaj_rms
      POSTGRES_USER: retaj_user
      POSTGRES_PASSWORD: retaj_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  postgres-shadow:
    image: postgres:15
    container_name: retaj-postgres-shadow
    environment:
      POSTGRES_DB: retaj_rms_shadow
      POSTGRES_USER: retaj_user
      POSTGRES_PASSWORD: retaj_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_shadow_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_shadow_data: