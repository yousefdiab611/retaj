# Local development stack: postgres, redis and (optionally) the
# api/web containers. For production, see docker-compose.prod.yml.
#
#   docker compose -f infra/docker-compose.yml up -d        # data plane only
#   docker compose -f infra/docker-compose.yml --profile app up -d  # full app

name: retaj-store

services:
  postgres:
    image: postgres:16-alpine
    container_name: retaj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retaj_store}
      POSTGRES_USER: ${POSTGRES_USER:-retaj_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retaj_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - retaj-postgres:/var/lib/postgresql/data
      - ../backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-shadow:
    image: postgres:16-alpine
    container_name: retaj-postgres-shadow
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_SHADOW_DB:-retaj_store_shadow}
      POSTGRES_USER: ${POSTGRES_USER:-retaj_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retaj_pass}
    ports:
      - "${POSTGRES_SHADOW_PORT:-5433}:5432"
    volumes:
      - retaj-postgres-shadow:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: retaj-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - retaj-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    profiles: ["app"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: retaj/api:dev
    container_name: retaj-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-retaj_user}:${POSTGRES_PASSWORD:-retaj_pass}@postgres:5432/${POSTGRES_DB:-retaj_store}?schema=public
      SHADOW_DATABASE_URL: postgresql://${POSTGRES_USER:-retaj_user}:${POSTGRES_PASSWORD:-retaj_pass}@postgres-shadow:5432/${POSTGRES_SHADOW_DB:-retaj_store_shadow}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?missing JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      TRUST_PROXY: "1"
    ports:
      - "${API_PORT:-3001}:3001"

  web:
    profiles: ["app"]
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_APP_RELEASE: ${VITE_APP_RELEASE:-dev}
    image: retaj/web:dev
    container_name: retaj-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:8080"

volumes:
  retaj-postgres:
  retaj-postgres-shadow:
  retaj-redis:
